name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
            binary_name: qql-go.exe
            asset_name: qql-go_{{VERSION}}_windows_amd64.zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary_name: qql-go
            asset_name: qql-go_{{VERSION}}_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary_name: qql-go
            asset_name: qql-go_{{VERSION}}_linux_arm64.tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary_name: qql-go
            asset_name: qql-go_{{VERSION}}_darwin_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary_name: qql-go
            asset_name: qql-go_{{VERSION}}_darwin_arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset_name="${{ matrix.asset_name }}"
          asset_name="${asset_name/\{\{VERSION\}\}/$version}"
          mkdir -p dist build

          export CGO_ENABLED=0
          export GOOS="${{ matrix.goos }}"
          export GOARCH="${{ matrix.goarch }}"

          binary_path="build/${{ matrix.binary_name }}"
          go build -ldflags="-s -w -X github.com/srimon12/qql-go/internal/cli/commands.Version=$version" -o "$binary_path" ./cmd/qql-go

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (
              cd build
              zip -q "../dist/$asset_name" "${{ matrix.binary_name }}"
            )
          else
            tar -C build -czf "dist/$asset_name" "${{ matrix.binary_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish-release:
    runs-on: ubuntu-latest
    needs: build-assets

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          (
            cd dist
            sha256sum * > "qql-go_${version}_checksums.txt"
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="qql-go ${tag#v}"
          notes_file="docs/releases/${tag#v}.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes_file" --latest
          else
            gh release create "$tag" dist/* \
              --title "$title" \
              --notes-file "$notes_file" \
              --latest
          fi
