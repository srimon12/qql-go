# qql-go gateway demo policy
#
# Simulates a multi-tenant SaaS platform (ACME Corp + Globex Corp)
# with department-level access control.
#
# Rules are evaluated top-to-bottom. First match wins.
# Unmatched requests are denied by default.

rules:
  # ── Platform admin: god mode ────────────────────────────────────────
  - match:
      claims:
        role: platform_admin
    allow:
      - QUERY
      - INSERT
      - UPDATE
      - DELETE
      - SCROLL
      - SELECT
      - SHOW
      - CREATE
      - DROP
      - ALTER
      - EXPLAIN

  # ── Org admin: full access within their tenant ──────────────────────
  - match:
      claims:
        role: admin
    allow:
      - QUERY
      - INSERT
      - UPDATE
      - DELETE
      - SCROLL
      - SELECT
      - SHOW
      - CREATE
      - ALTER
      - EXPLAIN
    inject:
      where:
        field: tenant_id
        from_claim: org_id
        op: "="

  # ── Manager: read + write within tenant ─────────────────────────────
  - match:
      claims:
        role: manager
    allow:
      - QUERY
      - INSERT
      - UPDATE
      - SCROLL
      - SELECT
      - SHOW
      - EXPLAIN
    inject:
      where:
        field: tenant_id
        from_claim: org_id
        op: "="
    limits:
      max_limit: 200

  # ── Finance reader: tenant + department scoped ──────────────────────
  - match:
      claims:
        role: reader
        department: finance
    allow:
      - QUERY
      - SCROLL
      - SELECT
      - SHOW
      - EXPLAIN
    collections:
      - docs
      - finance_*
      - reports_*
    inject:
      where:
        field: tenant_id
        from_claim: org_id
        op: "="
    limits:
      max_limit: 50

  # ── Engineering reader: tenant + department scoped ──────────────────
  - match:
      claims:
        role: reader
        department: engineering
    allow:
      - QUERY
      - SCROLL
      - SELECT
      - SHOW
      - EXPLAIN
    collections:
      - docs
      - engineering_*
    inject:
      where:
        field: tenant_id
        from_claim: org_id
        op: "="
    limits:
      max_limit: 50

  # ── Generic reader: tenant-scoped ───────────────────────────────────
  - match:
      claims:
        role: reader
    allow:
      - QUERY
      - SCROLL
      - SELECT
      - SHOW
      - EXPLAIN
    collections:
      - docs
    inject:
      where:
        field: tenant_id
        from_claim: org_id
        op: "="
    limits:
      max_limit: 50

  # ── Agent: narrowest surface, public docs only ──────────────────────
  - match:
      claims:
        token_type: agent
    allow:
      - QUERY
      - SCROLL
    collections:
      - docs
      - public_*
    inject:
      where:
        field: access_level
        value: public
    limits:
      max_limit: 10

  # ── Catch-all: deny ─────────────────────────────────────────────────
  - match:
      authenticated: true
    allow: []
