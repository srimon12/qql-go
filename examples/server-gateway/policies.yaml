# qql-go gateway demo policy
#
# Multi-tenant SaaS with department-level access control.
# Rules evaluated top-to-bottom. First match wins.

rules:
  # ── Platform admin: god mode ────────────────────────────────────────
  - match:
      claims:
        role: platform_admin
    allow: [QUERY, INSERT, UPDATE, DELETE, SCROLL, SELECT, SHOW, CREATE, DROP, ALTER, EXPLAIN]

  # ── Org admin: full access within tenant ────────────────────────────
  - match:
      claims:
        role: admin
    allow: [QUERY, INSERT, UPDATE, DELETE, SCROLL, SELECT, SHOW, CREATE, ALTER, EXPLAIN]
    inject:
      where:
        field: tenant_id
        from_claim: org_id
        op: "="

  # ── Manager: read + write, tenant scoped ────────────────────────────
  - match:
      claims:
        role: manager
    allow: [QUERY, INSERT, UPDATE, SCROLL, SELECT, SHOW, EXPLAIN]
    inject:
      where:
        field: tenant_id
        from_claim: org_id
        op: "="
    limits:
      max_limit: 200

  # ── Engineering reader: tenant + department scoped ──────────────────
  # Sees: engineering docs + org-wide docs (department=all)
  # Hides: confidential docs, other department docs
  - match:
      claims:
        role: reader
        department: engineering
    allow: [QUERY, SCROLL, SELECT, SHOW, EXPLAIN]
    collections: [docs]
    inject:
      filters:
        - field: tenant_id
          from_claim: org_id
          op: "="
        - field: department
          value: "engineering,all"
          op: "in"
        - field: access_level
          value: "confidential"
          op: "!="
    limits:
      max_limit: 50

  # ── Finance reader: tenant + department scoped ──────────────────────
  # Sees: finance docs + org-wide docs (department=all)
  # Hides: confidential docs, other department docs
  - match:
      claims:
        role: reader
        department: finance
    allow: [QUERY, SCROLL, SELECT, SHOW, EXPLAIN]
    collections: [docs]
    inject:
      filters:
        - field: tenant_id
          from_claim: org_id
          op: "="
        - field: department
          value: "finance,all"
          op: "in"
        - field: access_level
          value: "confidential"
          op: "!="
    limits:
      max_limit: 50

  # ── Generic reader: tenant scoped only ──────────────────────────────
  - match:
      claims:
        role: reader
    allow: [QUERY, SCROLL, SELECT, SHOW, EXPLAIN]
    collections: [docs]
    inject:
      where:
        field: tenant_id
        from_claim: org_id
        op: "="
    limits:
      max_limit: 50

  # ── Agent: public docs only ─────────────────────────────────────────
  - match:
      claims:
        token_type: agent
    allow: [QUERY, SCROLL]
    collections: [docs]
    inject:
      filters:
        - field: access_level
          value: "public"
          op: "="
    limits:
      max_limit: 10

  # ── Catch-all: deny ─────────────────────────────────────────────────
  - match:
      authenticated: true
    allow: []
