name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify version sync
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION | tr -d '[:space:]')"
          cmd_version="$(grep -oP 'var Version = "\K[^"]+' internal/cli/commands/executor.go)"

          echo "Tag:       v${tag_version}"
          echo "VERSION:   ${file_version}"
          echo "executor.go: ${cmd_version}"

          if [ "${tag_version}" != "${file_version}" ]; then
            echo "::error::VERSION file (${file_version}) does not match tag (v${tag_version})"
            exit 1
          fi

          if [ "${tag_version}" != "${cmd_version}" ]; then
            echo "::error::executor.go Version (${cmd_version}) does not match tag (v${tag_version})"
            exit 1
          fi

          echo "Version sync OK"

  build-assets:
    runs-on: ubuntu-latest
    needs: verify-version-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
            binary_name: qql-go.exe
            asset_name: qql-go_{{VERSION}}_windows_amd64.zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary_name: qql-go
            asset_name: qql-go_{{VERSION}}_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary_name: qql-go
            asset_name: qql-go_{{VERSION}}_linux_arm64.tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary_name: qql-go
            asset_name: qql-go_{{VERSION}}_darwin_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary_name: qql-go
            asset_name: qql-go_{{VERSION}}_darwin_arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset_name="${{ matrix.asset_name }}"
          asset_name="${asset_name/\{\{VERSION\}\}/$version}"
          mkdir -p dist build

          export CGO_ENABLED=0
          export GOOS="${{ matrix.goos }}"
          export GOARCH="${{ matrix.goarch }}"

          binary_path="build/${{ matrix.binary_name }}"
          go build -ldflags="-s -w -X github.com/srimon12/qql-go/internal/cli/commands.Version=$version" -o "$binary_path" ./cmd/qql-go

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (
              cd build
              zip -q "../dist/$asset_name" "${{ matrix.binary_name }}"
            )
          else
            tar -C build -czf "dist/$asset_name" "${{ matrix.binary_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  verify-binaries:
    runs-on: ubuntu-latest
    needs: build-assets
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify binary versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          native_archive="qql-go_${version}_linux_amd64.tar.gz"

          for archive in dist/*.tar.gz dist/*.zip; do
            [ -f "$archive" ] || continue
            echo "Verifying $(basename "$archive")..."

            tmpdir=$(mktemp -d)
            if [[ "$archive" == *.zip ]]; then
              unzip -q "$archive" -d "$tmpdir"
            else
              tar -xzf "$archive" -C "$tmpdir"
            fi

            binary=$(find "$tmpdir" -type f -name "qql-go*" | head -1)
            if [ -z "$binary" ]; then
              echo "::error::No binary found in $(basename "$archive")"
              exit 1
            fi

            # Only execute the native Linux binary on this runner.
            if [[ "$(basename "$archive")" == "$native_archive" ]]; then
              chmod +x "$binary"
              output=$("$binary" --version 2>&1 || "$binary" version 2>&1)
              if echo "$output" | grep -q "$version"; then
                echo "  OK: $output"
              else
                echo "::error::Version mismatch in $(basename "$archive"): expected $version, got $output"
                exit 1
              fi
            else
              # Cross-platform binary: verify version string is embedded
              if strings "$binary" 2>/dev/null | grep -q "$version"; then
                echo "  OK: version $version embedded in $(basename "$archive")"
              else
                echo "::error::Version string not found in $(basename "$archive")"
                exit 1
              fi
            fi

            rm -rf "$tmpdir"
          done

          echo "All binary versions verified"

  publish-release:
    runs-on: ubuntu-latest
    needs: verify-binaries

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          (
            cd dist
            sha256sum * > "qql-go_${version}_checksums.txt"
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="qql-go ${tag#v}"
          notes_file="docs/releases/${tag#v}.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" dist/* \
              --title "$title" \
              --notes-file "$notes_file"
          fi
